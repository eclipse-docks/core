name: Release

# After CI succeeds on main, release when that commit has a vX.Y.Z tag.
# Tag push also triggers release when CI already passed (covers tag-after-CI ordering).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  resolve:
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Find release tag on commit
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=""
          SHA="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"

          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            if ! echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Not a semver release tag: $VERSION"
              echo "version=" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs" \
              -f head_sha="$SHA" -f branch=main -f status=completed -f per_page=1 \
              --jq '.workflow_runs[0].conclusion // empty')
            if [ "$CONCLUSION" != "success" ]; then
              echo "CI has not succeeded on $SHA (conclusion: ${CONCLUSION:-none}); skipping release."
              echo "version=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Tag push: CI succeeded on $SHA; releasing $VERSION"
          else
            VERSION=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
            if [ -z "$VERSION" ]; then
              echo "No release tag on $SHA; skipping release."
            else
              echo "CI success: release tag $VERSION on $SHA"
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  release:
    needs: resolve
    if: needs.resolve.outputs.version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/app-release.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      publish_dir: packages/app/dist
      build_command: npm run build:app
      node_version_file: .nvmrc
      cname: docks.eclipse.dev
    secrets: inherit

  deploy-docs:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.version }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        env:
          DOCKS_DOCS_VERSION: ${{ needs.release.outputs.version }}
        run: npm run docs:build

      - name: Deploy docs to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/.vitepress/dist
          destination_dir: docs
          publish_branch: gh-pages
          keep_files: true

      - name: Docs deployment summary
        run: |
          echo "## Docs Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Release**: ${{ needs.release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: gh-pages" >> $GITHUB_STEP_SUMMARY
          echo "- **Path**: /docs/" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://docks.eclipse.dev/docs/" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  publish-npm:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.version }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update package versions (CI only, not committed)
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          VERSION="${VERSION#v}"
          for pkg in packages/core packages/extension-* packages/create-app packages/cli; do
            [ -d "$pkg" ] && (cd "$pkg" && npm version "$VERSION" --no-git-tag-version) && echo "Updated $pkg to $VERSION"
          done

      - name: Build core package
        run: npm run build

      - name: Build extension packages
        run: npm run build:extensions

      - name: Run type check
        run: npm run type-check
        continue-on-error: true

      - name: Publish core, extensions, create-app, and cli to npm
        run: |
          for pkg in packages/core packages/extension-* packages/create-app packages/cli; do
            if [ -d "$pkg" ]; then
              if grep -q '"private":\s*true' "$pkg/package.json" 2>/dev/null; then
                echo "Skipping $pkg (private)"
              else
                echo "Publishing $pkg..."
                (cd "$pkg" && npm publish --access public --provenance)
              fi
            fi
          done
